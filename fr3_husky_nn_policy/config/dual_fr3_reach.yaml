ppo_reach_policy_node:
  ros__parameters:
    model_path: ""
    # Non-empty selects finite open-loop trajectory replay instead of actor
    # inference. The trajectory still uses the same selectable action-reference,
    # safety, controller, and ReachRunLogger path as the learned policy.
    trajectory_path: ""
    # Rescale the trajectory's noise_* columns at replay time. Zero recovers
    # nominal actions; one uses the CSV's recorded noise level.
    trajectory_noise_scale: 1.0
    # Subscribe to the dual-arm broadcaster directly. This topic exists for
    # both real hardware and MuJoCo and contains exactly the 14 arm joints.
    joint_states_topic: /dual_fr3/joint_states
    target_pose_topic: /reach_target_pose
    base_frame: base
    command_topic: /policy_joint_command
    control_action: /fr3_policy_control

    policy_rate_hz: 20.0
    # false: q_target(t)=q_measured(t)+delta_q[k] at every controller step.
    # true: q_target[k]=q_measured(t_k)+delta_q[k], held until the next policy step.
    # The Reach launch exposes this as reach_policy_step_action:=true/false.
    reach_policy_step_action: false
    joint_state_timeout_s: 0.15
    command_timeout_s: 0.15
    # 0 means keep following terminal target updates until explicitly stopped.
    max_duration_s: 0.0

    # The NPZ applies the policy's final tanh. This clip is only a numerical guard;
    # relative offset = 0.1 * bounded_action.
    action_clip: 1.0
    max_policy_target_delta_rad: 0.11
    # Legacy trajectory-limiter parameters. They are ignored by Reach, which
    # uses the Isaac-style direct PD path, but remain in the shared action.
    max_actuator_step_rad: 0.001
    joint_velocity_scale: 0.10
    joint_acceleration_scale: 0.20
    # Legacy action-API field retained for message compatibility. Reference
    # timing is selected by reach_policy_step_action instead.
    relative_target_refresh_hz: 1000.0
    joint_limit_margin_rad: 0.02
    ready_tolerance_rad: 0.20

    # Safe defaults: inference runs, but no command is published.
    shadow_mode: true
    auto_start: false
    # Optional JSON sequence in dual_fr3_lab's format. Its first target is
    # applied when start_policy is accepted; each duration is measured from
    # that instant. An empty value keeps interactive target behavior.
    reach_goal_sequence: ""
    reach_goal_sequence_loop: false

    # All positions are relative to the robot base frame, as in training.
    target_position: [0.50, 0.00, 0.20]
    target_min: [0.40, -0.10, 0.10]
    target_max: [0.60, 0.10, 0.35]

    # Start recording when start_policy requests policy execution. An empty
    # log_root writes under fr3_husky_nn_policy/log. The Reach launch overrides
    # log_task_name to dual_fr3_reach for MuJoCo and dual_fr3_reach_real for
    # real hardware.
    log_root: ""
    log_task_name: dual_fr3_reach
    # Match the Isaac Lab reach reward: link7 + 0.132 m local Z, with the two
    # arm targets placed at reach center +/- 0.20 m along base Y.
    left_eef_frame: left_fr3_link7
    right_eef_frame: right_fr3_link7
    eef_offset_xyz: [0.0, 0.0, 0.132]
    # Legacy log metadata only. EEF TF is already expressed in `base`.
    robot_root_offset_xyz: [0.0, 0.0, 0.0]
    reach_offset_y: 0.20
